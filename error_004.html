const KEY_NAME = "error_004_code";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");

async function decryptWith(code) {
  const enc = new TextEncoder();
  const mat = await crypto.subtle.importKey("raw", enc.encode(norm(code)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64d(DATA.salt), iterations:600000, hash:"SHA-256" },
    mat, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64d(DATA.iv) }, key, b64d(DATA.ct));
  return new TextDecoder().decode(pt);
}

async function unlock(code, remember) {
  const html = await decryptWith(code);
  document.getElementById("vault").innerHTML = html;
  if (remember) { try { localStorage.setItem(KEY_NAME, code); } catch (e) {} }
}

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("go");
  msg.textContent = ""; btn.disabled = true; btn.textContent = "VERIFYING...";
  try { await unlock(document.getElementById("code").value, true); }
  catch (err) { msg.textContent = "ACCESS DENIED"; btn.disabled = false; btn.textContent = "ACCESS FILE"; }
});

(async () => {
  try {
    const saved = localStorage.getItem(KEY_NAME);
    if (saved) await unlock(saved, false);
  } catch (e) {}
})();
